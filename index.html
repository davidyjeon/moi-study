."}, {"id": "2-7", "category": "어휘", "stem": "The factory will _____ operations after the safety inspection is completed.", "choices": ["resume", "consume", "assume", "presume"], "answer": 0, "explanation": "중단한 운영을 재개한다는 뜻의 resume operations가 정확한 표현입니다."}, {"id": "2-8", "category": "준동사", "stem": "Staff members are encouraged _____ their passwords regularly.", "choices": ["change", "changed", "to change", "changing"], "answer": 2, "explanation": "be encouraged to + 동사원형 구조이므로 to change가 맞습니다."}, {"id": "2-9", "category": "비교", "stem": "The revised plan is _____ costly than the original proposal.", "choices": ["less", "lesser", "least", "few"], "answer": 0, "explanation": "비교급 구조 less + 형용사 + than이므로 less가 맞습니다."}, {"id": "2-10", "category": "가정법·도치", "stem": "Had we received your order earlier, we _____ it yesterday.", "choices": ["ship", "would ship", "would have shipped", "will have shipped"], "answer": 2, "explanation": "Had we received는 If we had received의 도치로 과거 사실의 반대 가정이므로 would have shipped가 맞습니다."}]}, {"id": 3, "title": "ROUND 03", "label": "실전 적응", "minutes": 8, "questions": [{"id": "3-1", "category": "품사", "stem": "The CEO expressed _____ about the project's future.", "choices": ["confident", "confidently", "confidence", "confide"], "answer": 2, "explanation": "타동사 expressed의 목적어가 되는 명사 confidence가 필요합니다."}, {"id": "3-2", "category": "시제·태", "stem": "By the time the auditors arrive, the team _____ the records.", "choices": ["has prepared", "had prepared", "will have prepared", "prepares"], "answer": 2, "explanation": "미래의 특정 시점까지 완료될 일을 표현하므로 미래완료 will have prepared가 적절합니다."}, {"id": "3-3", "category": "수일치", "stem": "The number of visitors _____ increased since the renovation.", "choices": ["have", "has", "are", "were"], "answer": 1, "explanation": "the number of + 복수명사는 단수 주어로 취급하므로 has increased가 맞습니다."}, {"id": "3-4", "category": "전치사", "stem": "The shipment was delayed _____ severe weather conditions.", "choices": ["due to", "because", "although", "unless"], "answer": 0, "explanation": "명사구 severe weather conditions 앞에는 due to가 오며 because는 절을 이끕니다."}, {"id": "3-5", "category": "접속사", "stem": "The system will remain offline _____ the upgrade is complete.", "choices": ["until", "despite", "during", "because of"], "answer": 0, "explanation": "업그레이드 완료 시점까지라는 뜻을 나타내며 뒤에 절이 오는 until이 정답입니다."}, {"id": "3-6", "category": "관계사", "stem": "The proposal, _____ was submitted on Monday, includes a revised budget.", "choices": ["that", "which", "who", "whose"], "answer": 1, "explanation": "콤마로 분리된 계속적 용법의 사물 관계대명사는 which를 사용합니다."}, {"id": "3-7", "category": "어휘", "stem": "The board decided to _____ the deadline by two weeks.", "choices": ["extend", "expand", "extract", "expose"], "answer": 0, "explanation": "마감일을 연장한다는 뜻으로 extend the deadline을 씁니다."}, {"id": "3-8", "category": "준동사", "stem": "The team avoided _____ additional costs by changing vendors.", "choices": ["incur", "incurred", "to incur", "incurring"], "answer": 3, "explanation": "avoid 다음에는 동명사가 오므로 incurring이 맞습니다."}, {"id": "3-9", "category": "비교", "stem": "Of the three models, the latest one is the _____ efficient.", "choices": ["more", "most", "much", "many"], "answer": 1, "explanation": "세 개 이상 중 가장 효율적이라는 최상급이므로 most가 필요합니다."}, {"id": "3-10", "category": "가정법·도치", "stem": "Were the price lower, we _____ a larger quantity.", "choices": ["purchase", "purchased", "would purchase", "had purchased"], "answer": 2, "explanation": "Were the price lower는 If the price were lower의 도치로, 주절은 would purchase입니다."}]}, {"id": 4, "title": "ROUND 04", "label": "오답 줄이기", "minutes": 8, "questions": [{"id": "4-1", "category": "품사", "stem": "The instructions are _____ clear for new employees to follow.", "choices": ["sufficient", "sufficiently", "sufficiency", "suffice"], "answer": 1, "explanation": "형용사 clear를 수식하는 부사 sufficiently가 필요합니다."}, {"id": "4-2", "category": "시제·태", "stem": "The documents _____ before the inspection began yesterday.", "choices": ["had been filed", "have filed", "filing", "will be filing"], "answer": 0, "explanation": "과거의 검사보다 먼저 서류가 정리되어 있었으므로 과거완료 수동태 had been filed가 맞습니다."}, {"id": "4-3", "category": "수일치", "stem": "A list of approved vendors _____ available on the intranet.", "choices": ["are", "is", "have", "were"], "answer": 1, "explanation": "주어의 핵심은 단수 명사 A list이므로 is입니다."}, {"id": "4-4", "category": "전치사", "stem": "The customer requested a refund _____ a damaged item.", "choices": ["for", "at", "from", "since"], "answer": 0, "explanation": "손상된 물품에 대한 환불이라는 뜻으로 a refund for an item이 자연스럽습니다."}, {"id": "4-5", "category": "접속사", "stem": "_____ completing the survey, participants will receive a confirmation email.", "choices": ["After", "Despite", "Unless", "Because"], "answer": 0, "explanation": "설문을 마친 후 이메일을 받으므로 After + -ing가 맞습니다."}, {"id": "4-6", "category": "관계사", "stem": "The training room _____ we held the seminar has been renovated.", "choices": ["where", "who", "whose", "which"], "answer": 0, "explanation": "관계절에서 장소를 나타내는 부사 역할을 하므로 where가 맞습니다."}, {"id": "4-7", "category": "어휘", "stem": "The manufacturer has decided to _____ the defective units.", "choices": ["recall", "reclaim", "recover", "receive"], "answer": 0, "explanation": "결함 제품을 회수한다는 의미로 recall the defective units가 맞습니다."}, {"id": "4-8", "category": "준동사", "stem": "Employees must refrain from _____ confidential documents outside the office.", "choices": ["share", "to share", "shared", "sharing"], "answer": 3, "explanation": "refrain from에서 from은 전치사이므로 동명사 sharing이 옵니다."}, {"id": "4-9", "category": "비교", "stem": "Sales in April were nearly twice as high _____ those in March.", "choices": ["as", "than", "from", "like"], "answer": 0, "explanation": "배수 비교는 twice as + 형용사 + as 구조입니다."}, {"id": "4-10", "category": "가정법·도치", "stem": "If I _____ you, I would contact the client today.", "choices": ["am", "were", "have been", "will be"], "answer": 1, "explanation": "현재 사실과 다른 가정에서 If I were you를 사용합니다."}]}, {"id": 5, "title": "ROUND 05", "label": "고득점 도전", "minutes": 8, "questions": [{"id": "5-1", "category": "품사", "stem": "The _____ of the new software took longer than expected.", "choices": ["implement", "implementation", "implementing", "implemented"], "answer": 1, "explanation": "정관사 The와 of 사이에는 명사 implementation이 필요합니다."}, {"id": "5-2", "category": "시제·태", "stem": "The contract _____ by both parties before the launch.", "choices": ["must sign", "must be signed", "must have signing", "must signing"], "answer": 1, "explanation": "계약서가 서명되어야 하므로 조동사 + 수동태 must be signed가 맞습니다."}, {"id": "5-3", "category": "수일치", "stem": "The findings from the latest surveys _____ consistent with earlier results.", "choices": ["is", "was", "are", "has"], "answer": 2, "explanation": "주어의 핵심 명사 findings는 복수이므로 are consistent가 맞습니다."}, {"id": "5-4", "category": "전치사", "stem": "Additional equipment can be ordered _____ request.", "choices": ["upon", "inside", "onto", "across"], "answer": 0, "explanation": "upon request는 요청 시에라는 뜻의 고정 표현입니다."}, {"id": "5-5", "category": "접속사", "stem": "The company introduced a flexible schedule _____ employees could avoid rush-hour traffic.", "choices": ["so that", "even though", "in spite of", "unless"], "answer": 0, "explanation": "직원들이 출퇴근 혼잡을 피할 수 있도록이라는 목적이므로 so that이 정답입니다."}, {"id": "5-6", "category": "관계사", "stem": "The employee to _____ the award was given thanked the team.", "choices": ["who", "whom", "whose", "which"], "answer": 1, "explanation": "전치사 to 뒤에서 사람을 받는 목적격 관계대명사 whom이 맞습니다."}, {"id": "5-7", "category": "어휘", "stem": "The new software is _____ with most existing devices.", "choices": ["compatible", "considerable", "comparable", "competitive"], "answer": 0, "explanation": "기존 기기와 호환된다는 뜻으로 compatible with가 맞습니다."}, {"id": "5-8", "category": "준동사", "stem": "The customer agreed _____ the revised terms.", "choices": ["accept", "accepting", "to accept", "accepted"], "answer": 2, "explanation": "agree는 목적어로 to부정사를 취하므로 to accept가 맞습니다."}, {"id": "5-9", "category": "비교", "stem": "This device operates more _____ than its predecessor.", "choices": ["efficient", "efficiently", "efficiency", "efficiencies"], "answer": 1, "explanation": "동사 operates를 수식하는 부사의 비교형 more efficiently가 맞습니다."}, {"id": "5-10", "category": "가정법·도치", "stem": "Should you _____ assistance, contact the help desk.", "choices": ["need", "needed", "needing", "to need"], "answer": 0, "explanation": "Should you need는 If you should need의 도치형이므로 동사원형 need가 옵니다."}]}, {"id": 6, "title": "ROUND 06", "label": "파이널 체크", "minutes": 8, "questions": [{"id": "6-1", "category": "품사", "stem": "We appreciate your _____ response to our inquiry.", "choices": ["prompt", "promptly", "promptness", "prompted"], "answer": 0, "explanation": "명사 response를 수식하는 형용사 prompt(신속한)가 필요합니다."}, {"id": "6-2", "category": "시제·태", "stem": "The supervisor _____ the report when the phone rang.", "choices": ["reviews", "was reviewing", "has reviewed", "will review"], "answer": 1, "explanation": "전화가 울리던 과거 시점에 진행 중인 동작이므로 was reviewing이 맞습니다."}, {"id": "6-3", "category": "수일치", "stem": "Every piece of equipment _____ inspected before use.", "choices": ["are", "have", "is", "were"], "answer": 2, "explanation": "Every piece가 단수 주어이므로 is inspected가 맞습니다."}, {"id": "6-4", "category": "전치사", "stem": "The package arrived _____ schedule despite the storm.", "choices": ["on", "in", "over", "at"], "answer": 0, "explanation": "on schedule은 예정대로라는 뜻의 고정 표현입니다."}, {"id": "6-5", "category": "접속사", "stem": "_____ the budget was approved, the team began hiring.", "choices": ["Once", "Unless", "Despite", "Whereas"], "answer": 0, "explanation": "예산이 승인된 후 채용을 시작했다는 뜻으로 Once가 자연스럽습니다."}, {"id": "6-6", "category": "관계사", "stem": "The designer _____ portfolio impressed the committee received an offer.", "choices": ["who", "whose", "whom", "which"], "answer": 1, "explanation": "디자이너의 포트폴리오라는 소유 관계이므로 whose가 맞습니다."}, {"id": "6-7", "category": "어휘", "stem": "The new policy will _____ all full-time employees.", "choices": ["apply to", "comply with", "depend upon", "result from"], "answer": 0, "explanation": "정책이 직원들에게 적용된다는 뜻이므로 apply to가 정답입니다."}, {"id": "6-8", "category": "준동사", "stem": "We look forward to _____ with your team next quarter.", "choices": ["work", "worked", "working", "to work"], "answer": 2, "explanation": "look forward to에서 to는 전치사이므로 working이 맞습니다."}, {"id": "6-9", "category": "비교", "stem": "The second proposal is _____ practical of the two.", "choices": ["the more", "the most", "more", "most"], "answer": 0, "explanation": "두 대상 중 더 ~한 것을 특정할 때 the more + 형용사 + of the two를 씁니다."}, {"id": "6-10", "category": "가정법·도치", "stem": "If the report had been submitted on time, the committee _____ it already.", "choices": ["reviews", "will review", "would have reviewed", "had reviewed"], "answer": 2, "explanation": "과거 사실과 반대되는 가정이므로 would have reviewed가 맞습니다."}]}]</script>

  const chars=['🌿','🍋','☁️','🪄','🎧','⭐'];
  const state={backendAvailable:false,mode:'loading',user:null,attempts:[],view:'home',quiz:null,resultId:null,authTab:'login',reviewFilter:'wrong',modal:null,homeTab:'reading'};
  const root=document.getElementById('app');
  let timer=null;let toastTimer=null;
  const saved=()=>{try{return JSON.parse(storage.getItem('moi_demo_attempts')||'[]')}catch{return []}};
  const quizKey=()=>`moi_active_${state.user?.id||'demo'}`;
  const saveActive=()=>{if(state.quiz)storage.setItem(quizKey(),JSON.stringify(state.quiz))};
  const storedActive=()=>{try{return JSON.parse(storage.getItem(quizKey())||'null')}catch{return null}};
  function fmtDate(iso){return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
  function timeFormat(sec){const n=Math.max(0,Math.round(sec));return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}
  function stats(){let completed=new Set(state.attempts.map(a=>a.roundId)).size;let totalCorrect=state.attempts.reduce((n,a)=>n+a.correct,0);let total=state.attempts.reduce((n,a)=>n+a.total,0);return {completed,totalCorrect,total,accuracy:total?Math.round(totalCorrect/total*100):0,points:totalCorrect*10,attempts:state.attempts.length}}
  function latest(id){return state.attempts.find(a=>a.roundId===id)}
  function breakdown(){const b={};rounds.flatMap(r=>r.questions).forEach(q=>{b[q.category]={category:q.category,correct:0,total:0}});for(const a of state.attempts){const r=Q[a.roundId];if(!r)continue;r.questions.forEach((q,i)=>{const row=b[q.category];row.total++;if(a.answers[i]===q.answer)row.correct++})}return Object.values(b).sort((x,y)=>x.total===0&&y.total>0?1:y.total===0&&x.total>0?-1:(x.total?x.correct/x.total:1)-(y.total?y.correct/y.total:1))}
  function toast(message){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=message;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3200)}
  async function api(path,opts={}){const res=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...opts});let data=await res.json().catch(()=>({error:'서버 응답을 읽지 못했어요.'}));if(!res.ok){let ex=new Error(data.error||'다시 시도해 주세요.');ex.status=res.status;throw ex;}return data}
  async function init(){if(location.protocol==='file:' || location.protocol==='about:'){demo();return}try{let me=await api('/me');state.backendAvailable=true;state.mode='server';state.user=me.user;await loadAttempts()}catch(x){if(x.status===401){state.backendAvailable=true;state.mode='server'}else{demo();return}}render()}
  function demo(){state.mode='demo';state.user={name:'모이 친구',id:'demo'};state.attempts=saved().sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt));render()}
  async function loadAttempts(){const data=await api('/attempts');state.attempts=data.attempts.sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt))}
  function header(){let s=stats();return `<div class="topline"><span class="mini-eyebrow"><span class="dot"></span> YOUR ENGLISH JOURNEY</span><div class="top-actions"><div class="soft-pill">⭐ <b>${s.points}</b> POINTS</div><div class="soft-pill primary">☀️ ${s.completed} / ${rounds.length} ROUNDS</div></div></div>`}
  function sidebar(){return `<aside class="side"><div><a href="#" class="brand" data-route="home" aria-label="moi 홈">moi<i>✦</i></a><div class="brand-note">A LITTLE EVERY DAY</div></div><nav class="sidebar-nav" aria-label="메뉴">${Object.keys(labels).map(k=>`<button type="button" data-route="${k}" class="nav-btn ${state.view===k?'active':''}">${svg(k)} ${labels[k]}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-mascot"><img src="${img('calm')}" alt="모이 캐릭터"><p>조금씩 쌓이면 실력이 돼!</p><small>오늘도 모이랑 함께해요 ♡</small></div><div class="side-profile"><div class="avatar">${e(state.user.name.charAt(0))}</div><div><strong>${e(state.user.name)}</strong><span>${state.mode==='demo'?'체험 모드':'나의 학습 공간'}</span></div>${state.backendAvailable?`<button class="icon-button" data-action="logout" aria-label="로그아웃" title="로그아웃">${svg('logout')}</button>`:''}</div></div></aside>`}
  function mobile(){return `<div class="mobile-header"><a class="brand" href="#" data-route="home">moi<i>✦</i></a><div class="soft-pill primary">⭐ ${stats().points} P</div></div><nav class="mobile-nav" aria-label="모바일 메뉴">${Object.keys(labels).map(k=>`<button class="${state.view===k?'active':''}" data-route="${k}">${svg(k)}${names[k]}</button>`).join('')}</nav>`}
  function worldNav(){
    const entries=[['home','학습하기'],['rounds','전체 회차'],['history','기록'],['insights','통계']];
    let s=stats();
    return `<header class="world-nav-bar"><button class="world-logo" data-route="home" aria-label="moi 홈">mo<span>i</span><i>✦</i></button><nav class="world-nav-links" aria-label="주 메뉴">${entries.map(([k,label])=>`<button class="world-nav-link ${state.view===k?'on':''}" data-route="${k}">${svg(k)}<span>${label}</span></button>`).join('')}</nav><div class="world-nav-user"><span class="world-star-count" title="맞힌 문제로 모은 별 포인트">✦ ${s.points}<small>P</small></span><button class="world-profile" data-action="profile" aria-label="학습자 정보"><img src="${img('calm')}" alt=""><span>${e(state.user.name)}</span></button><button class="world-gear" data-action="settings" aria-label="설정 및 기록 백업">⚙</button></div></header>`
  }
  function siteNav(){
    const active=state.view==='history'||state.view==='result'?'history':state.view==='review'||state.view==='wrong'?'wrong':state.view==='insights'?'insights':'home';
    const links=[['home','학습하기',svg('home'),'route'],['history','기록',svg('history'),'route'],['wrong','오답노트','<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>','action'],['insights','통계',svg('insights'),'route']];

  function home(){
    const s=stats();
    const resume=storedActive();
    const next=rounds.find(r=>!latest(r.id))||rounds[0];
    const focusId=resume?.roundId||next.id;
    const recent=state.attempts[0];
    const totalMinutes=Math.round(state.attempts.reduce((a,x)=>a+(x.elapsedSeconds||0),0)/60);
    const streak=(()=>{const dates=new Set(state.attempts.map(a=>new Date(a.finishedAt).toLocaleDateString('en-CA')));let n=0,d=new Date();if(!dates.has(d.toLocaleDateString('en-CA')))d.setDate(d.getDate()-1);while(dates.has(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1)}return n})();
    const completedOnce=rounds.filter(r=>latest(r.id)).length;
    const zeroText=completedOnce?`${recent.roundId}회차 문제풀이 완료! 🎉`:'모이가 기다리고 있었어! ✨';
    const subText=completedOnce?'틀린 문제도 함께 복습해보자!':'첫 10문제로 시작해볼까?';
    const miniRound=(r)=>{
      const a=latest(r.id);const isActive=r.id===focusId;
      return `<button class="world-round-row ${a?'is-complete':''} ${isActive?'is-next':''}" data-round="${r.id}" aria-label="${r.id}회차 ${a?'다시 풀기':'풀기'}"><span class="world-check">${a?'✓':String(r.id).padStart(2,'0')}</span><span class="world-round-info"><strong>${r.id}회차 <small>${e(r.label)}</small></strong><span>Part 5 · 문법 ${r.questions.length}문제 · ${r.minutes}분</span></span><span class="world-round-end">${a?`<span class="world-round-score">${a.score}점</span>`:'›'}</span></button>`
    };

  }
  function roundsPage(){return shell(`${header()}<section class="section-intro anim-in"><div class="mini-eyebrow">YOUR LEARNING PATH</div><h1>한 회차씩, 천천히 ✦</h1><p>총 ${rounds.length}회차 · ${rounds.reduce((n,r)=>n+r.questions.length,0)}문제 · 각 8분 제한. 완료한 회차도 언제든 다시 풀 수 있어요.</p></section><section class="round-grid">${rounds.map(card).join('')}</section><div class="info-strip">💛 각 회차는 서로 다른 10개의 오리지널 문항으로 구성돼요. 재응시하면 이전 기록은 사라지지 않고 새 시도로 추가됩니다.</div>`)}
  function history(){return shell(`${header()}<section class="section-intro anim-in"><div class="mini-eyebrow">YOUR STORY SO FAR</div><h1>학습 기록 📚</h1><p>한 번 푼 시험도 기록으로 남고, 언제든 복습하거나 다시 도전할 수 있어요.</p></section>${state.attempts.length?`<div class="history-list">${state.attempts.map((a,i)=>`<article class="history-item anim-in"><div class="round-emoji">${chars[(a.roundId-1)%chars.length]}</div><div><strong>${a.roundId}회차 · ${Q[a.roundId]?.label||''}</strong><div class="secondary-text">${fmtDate(a.finishedAt)} · ${timeFormat(a.elapsedSeconds)} 소요 · ${state.attempts.filter(t=>t.roundId===a.roundId).length}회 누적 응시</div></div><div class="history-score">${a.score}<span style="font-size:12px;color:#a6adc3"> / 100</span></div><div class="history-view" style="display:flex;gap:6px"><button class="btn mini secondary" data-result="${a.id}">오답 보기</button><button class="btn mini ghost" data-round="${a.roundId}" data-new="1">재응시 ↗</button></div></article>`).join('')}</div>`:emptyState('아직 저장된 시험이 없어요','첫 회차를 풀면 응시 날짜, 점수, 정답·오답이 이곳에 기록돼요.','첫 회차 풀기','round',1)}`)}
  function insights(){let arr=breakdown();let s=stats();let attempted=arr.filter(x=>x.total);return shell(`${header()}<section class="section-intro anim-in"><div class="mini-eyebrow">UNDERSTAND YOUR PROGRESS</div><h1>나의 약점 연구소 🔎</h1><p>틀린 문제들을 분석해서 어떤 문법 영역을 더 공부해야 할지 보여줄게요.</p></section>${s.total?`<div class="two-columns"><div class="panel anim-in"><h3>영역별 정답률</h3><p class="chart-sub">모든 응시 기록에서 집계한 결과예요. 재응시도 포함됩니다.</p><div class="category-bars">${arr.map(b=>{let n=b.total?Math.round(100*b.correct/b.total):0;return `<div><div class="category-line-head"><b>${b.category}</b><span>${b.total?`${b.correct}/${b.total} 정답 · ${n}%`:'미응시'}</span></div><div class="category-track"><div class="${n>=80?'high':n<60?'low':''}" style="width:${n}%"></div></div></div>`}).join('')}</div></div><div><div class="panel anim-in"><h3>모이의 약점 분석</h3><img src="${img('thinking')}" style="width:150px;height:135px;object-fit:contain;display:block;margin:0 auto;mix-blend-mode:multiply" alt="고민하는 모이"><p style="text-align:center;font-size:13px;line-height:1.9;color:#8c95ac">${attempted.filter(x=>x.correct<x.total).length?`<b style="color:#7588b7">${e(attempted[0].category)}</b> 영역부터 다시 연습해 볼까?<br>틀린 이유를 이해하면 점수가 더 빨리 올라!`:'지금까지 전부 정답이야!<br>다음 회차도 자신 있게 도전해 봐.'}</p><button class="btn full" data-route="history">오답노트 보러 가기 →</button></div><div class="tip-panel" style="margin-top:16px;min-height:unset"><div class="tip-emoji">🌼</div><h3>800+ 목표를 위한 습관</h3><p>① 시간을 재고 풀기<br>② 틀린 영역의 문법 복습<br>③ 2~3일 후 같은 회차 재응시</p></div></div></div>`:emptyState('분석할 학습 기록이 없어요','한 회차를 풀고 나면 모이가 취약한 문법 영역을 알려줄게!','학습 시작하기','round',1)}`)}
  function wrongEmpty(){return shell(`<section class="section-intro anim-in"><div class="mini-eyebrow">REVIEW WITH MOI</div><h1>오답노트 ✏️</h1><p>틀린 문제도 차근차근 살펴보면 다음엔 정답을 찾을 수 있어.</p></section>${emptyState('아직 복습할 오답이 없어요','첫 회차를 풀고 틀린 문제를 모이와 함께 확인해 보자.','첫 회차 풀기','round',1)}`)}
  function emptyState(title,desc,button,type,id){return `<div class="no-results"><img src="${img('calm')}" alt="모이"><h3>${title}</h3><p>${desc}</p><button class="btn" ${type==='round'?`data-round="${id}"`:`data-route="${type}"`}>${button} →</button></div>`}
  function quizPage(){let z=state.quiz,r=Q[z.roundId],q=r.questions[z.index],answered=z.answers.filter(x=>x!==null).length;return shell(`<div class="quiz-page"><div class="quiz-head"><button class="quiz-back" data-action="quit">← 나가기</button><div class="quiz-head-title"><b>${r.title} · ${e(r.label)}</b><span>TOEIC Part 5 Practice</span></div><div id="clock" class="timer">${timeFormat(remaining())}</div></div><div class="progress-line"><div class="progress-fill" style="width:${(z.index+1)/r.questions.length*100}%"></div></div><div class="question-progress"><span>QUESTION ${String(z.index+1).padStart(2,'0')} / ${r.questions.length}</span><span>${answered}/${r.questions.length} ANSWERED</span></div><div class="question-layout"><div class="question-card anim-in"><div class="question-kicker">✦ ${e(q.category).toUpperCase()} · SELECT ONE ANSWER</div><h1 class="question-text">${e(q.stem)}</h1><div class="answer-list" role="group" aria-label="선택지">${q.choices.map((opt,i)=>`<button type="button" class="answer-btn ${z.answers[z.index]===i?'selected':''}" data-answer="${i}" aria-pressed="${z.answers[z.index]===i}"><span class="answer-alpha">${'ABCD'[i]}</span>${e(opt)}</button>`).join('')}</div><div class="question-actions"><button class="btn ghost" ${z.index===0?'disabled':''} data-action="previous">← 이전 문제</button><button class="btn" data-action="${z.index===r.questions.length-1?'submit':'next'}">${z.index===r.questions.length-1?'답안 제출 ✓':'다음 문제 →'}</button></div></div><aside class="quiz-aside"><img src="${img('thinking')}" alt="생각하는 모이"><p>천천히 읽어봐, 할 수 있어!</p><small>정답을 몰라도 괜찮아.<br>끝나고 같이 복습하자.</small><div class="jump-grid">${r.questions.map((_,i)=>`<button class="jump-btn ${z.index===i?'current':z.answers[i]!==null?'answered':''}" data-jump="${i}" aria-label="${i+1}번 문제">${i+1}</button>`).join('')}</div><div class="quiz-hint">한 문제당 48초 페이스로<br>8분 안에 10문제를 완성해 보세요!</div></aside></div></div>`)}
  function remaining(){if(!state.quiz)return 0;return Math.max(0,Q[state.quiz.roundId].minutes*60-Math.floor((Date.now()-state.quiz.startTime)/1000))}
  function result(){let a=state.attempts.find(a=>a.id===state.resultId);if(!a){state.view='history';return history()}let r=Q[a.roundId],n=a.correct;let happy=n>=7;return shell(`${header()}<div class="breadcrumbs"><button data-route="history">학습 기록</button> / ${r.title} / 결과</div><div class="result-layout"><section class="result-hero anim-in"><span class="hero-tag">✦ ${r.title} COMPLETE</span><h1>${happy?'오늘도 해냈어!':'끝까지 해낸 게 멋져!'}</h1><p>${happy?'차곡차곡 쌓인 실력이 느껴져. 다음 회차도 도전해 볼까?':'틀린 문제는 앞으로 성장할 힌트야. 모이랑 다시 살펴보자!'}</p><div class="result-total">${a.score}<small> / 100 POINTS</small></div><img src="${img(happy?'cheer':'calm')}" alt="${happy?'응원':'격려'}하는 모이"></section><div class="result-side"><div class="result-metrics"><div class="panel anim-in"><div class="metric-label">정답 문항</div><div class="metric-num">${n}<span style="font-size:14px;color:#a3abc1"> / ${a.total}</span></div><span class="metric-label">정답률 ${Math.round(100*n/a.total)}%</span></div><div class="panel anim-in"><div class="metric-label">소요 시간</div><div class="metric-num">${timeFormat(a.elapsedSeconds)}</div><span class="metric-label">제한 ${r.minutes}분</span></div></div><div class="panel anim-in" style="flex:1"><h3>이번 시험의 문법 분포</h3><p class="chart-sub">오답 유형을 아래에서 바로 복습할 수 있어요.</p><div style="display:flex;flex-wrap:wrap;gap:8px">${[...new Set(r.questions.filter((q,i)=>a.answers[i]!==q.answer).map(q=>q.category))].map(t=>`<span class="soft-pill" style="padding:8px 11px">✎ ${t}</span>`).join('')||'<span class="soft-pill">🌟 전부 정답!</span>'}</div></div></div></div><div class="result-actions"><button class="btn" data-action="review">오답노트 확인하기 →</button><button class="btn secondary" data-round="${r.id}" data-new="1">같은 회차 다시 풀기</button><button class="btn ghost" data-route="rounds">다른 회차 선택</button></div><div class="notice">* 100점 만점은 해당 10문제의 정답률을 뜻하며, 공식 TOEIC 점수로 환산된 결과가 아닙니다.</div>`)}
  function review(){let a=state.attempts.find(a=>a.id===state.resultId);if(!a){state.view='history';return history()}let r=Q[a.roundId];let items=r.questions.map((q,i)=>({...q,index:i,chosen:a.answers[i],correct:a.answers[i]===q.answer}));let filtered=state.reviewFilter==='wrong'?items.filter(x=>!x.correct):items;return shell(`${header()}<div class="breadcrumbs"><button data-route="history">학습 기록</button> / <button data-action="back-result">${r.title} 결과</button> / 오답노트</div><div class="section-intro"><div class="mini-eyebrow">LEARN FROM EVERY QUESTION</div><h1>모이의 오답노트 ✏️</h1><p>문제를 다시 읽고 해설을 확인해 보세요. 이전 응시 답안도 함께 남아 있어요.</p></div><div class="section-head" style="margin-top:0"><div><strong style="font-size:12px;color:#8b96b1">정답 ${a.correct}/${a.total} · 오답 ${a.total-a.correct}</strong></div><div class="filter-pills"><button class="filter-pill ${state.reviewFilter==='wrong'?'on':''}" data-filter="wrong">오답만 (${a.total-a.correct})</button><button class="filter-pill ${state.reviewFilter==='all'?'on':''}" data-filter="all">전체 문제</button></div></div><div class="review-list">${filtered.length?filtered.map(q=>`<article class="review-card anim-in ${q.correct?'correct':'wrong'}"><div class="review-top"><span>QUESTION ${String(q.index+1).padStart(2,'0')} · ${e(q.category)}</span><span class="review-status">${q.correct?'✓ 정답':'✕ 오답 / 미응답'}</span></div><h3>${e(q.stem)}</h3><div class="review-options">${q.choices.map((v,i)=>`<div class="review-opt ${i===q.answer?'correct':i===q.chosen&&!q.correct?'wrong':''}">${'ABCD'[i]}. ${e(v)} ${i===q.answer?'✓ 정답':i===q.chosen&&!q.correct?'← 내 선택':''}</div>`).join('')}</div><div class="review-explain"><b>모이의 해설 ✦</b><div>${e(q.explanation)}</div></div></article>`).join(''):`<div class="no-results"><img src="${img('cheer')}" alt="기뻐하는 모이"><h3>틀린 문제가 하나도 없어! 🎉</h3><p>전체 문제 보기를 눌러 해설을 복습할 수 있어요.</p></div>`}</div><div class="result-actions"><button class="btn" data-round="${a.roundId}" data-new="1">이 회차 다시 풀기 ↗</button><button class="btn ghost" data-route="history">학습 기록으로</button></div>`)}
  function auth(){return `<div class="auth-shell"><section class="auth-art"><div class="auth-logo"><div class="brand">moi<i>✦</i></div><div class="brand-note">A LITTLE EVERY DAY</div></div><div><h2 class="auth-heading">조금씩,<br><span>매일 더 잘하게.</span></h2><p>영어 공부의 작은 파트너, 모이.<br>오늘의 10문제를 함께 시작해 볼까?</p></div><img class="auth-character" src="${img('hero')}" alt="공부하는 캐릭터 모이"><div class="auth-art-bottom"><span>✦ 6 ROUNDS</span><span>✦ 60 QUESTIONS</span><span>✦ YOUR OWN JOURNEY</span></div></section><section class="auth-form-wrap"><form class="auth-form" id="auth-form"><span class="eyebrow">HELLO, STUDY BUDDY!</span><h1>반가워, 모이가 기다렸어 ♡</h1><p class="lead">나만의 기록을 쌓고, 언제든 이어서 공부해요.</p><div class="auth-tabs"><button type="button" class="${state.authTab==='login'?'selected':''}" data-auth="login">로그인</button><button type="button" class="${state.authTab==='register'?'selected':''}" data-auth="register">처음 왔어요</button></div><label class="field"><span>이름 / 아이디</span><input id="username" name="name" type="text" placeholder="2~24자, 한글이나 영문" autocomplete="username" minlength="2" maxlength="24" required></label><label class="field"><span>비밀번호</span><input id="password" name="password" type="password" placeholder="8자 이상 입력해 주세요" autocomplete="${state.authTab==='login'?'current-password':'new-password'}" minlength="8" maxlength="72" required></label><button class="btn full" style="padding:16px" type="submit">${state.authTab==='login'?'내 학습 기록으로 들어가기':'모이와 공부 시작하기'} →</button><div class="auth-message" id="auth-message" role="alert"></div><p class="auth-hint">${state.authTab==='login'?'한 번 등록한 이름과 비밀번호로 다시 로그인할 수 있어요.':'비밀번호는 암호화된 해시로 저장되며, 서버에서 본인 기록을 보호해요.'}</p><button type="button" class="text-button" data-action="demo" style="font-size:12px">계정 없이 먼저 둘러보기 →</button><div class="auth-bottom">YOUR ENGLISH JOURNEY, WITH MOI ✦</div></form></section></div>`}
  function modal(){if(!state.modal)return '';let m=state.modal;if(m.type==='settings')return `<div class="modal-shade"><div class="modal" role="dialog" aria-modal="true"><img src="${img('laptop')}" alt="모이"><h2>나의 학습 기록 관리</h2><p>${state.mode==='demo'?'이 브라우저에 기록이 저장돼요. 파일을 옮길 때는 백업 기능을 이용해 주세요.':'로그인한 계정의 기록은 서버에 저장돼요.'}</p><div class="modal-actions"><button class="btn secondary" data-action="export-progress">기록 백업 ↓</button>${state.mode==='demo'?'<button class="btn" data-action="import-progress">백업 가져오기 ↑</button><input type="file" id="moi-import" accept=".json,application/json" hidden>':''}</div><button class="btn ghost" style="margin-top:12px;width:100%" data-action="cancel-modal">닫기</button></div></div>`;if(m.type==='profile')return `<div class="modal-shade"><div class="modal" role="dialog" aria-modal="true"><img src="${img('calm')}" alt="모이"><h2>${e(state.user.name)}의 공부방 ♡</h2><p>완료 회차 ${stats().completed}개 · ${stats().attempts}번 응시</p><div class="modal-actions"><button class="btn secondary" data-action="settings">기록 관리</button>${state.backendAvailable?'<button class="btn" data-action="logout">로그아웃</button>':''}<button class="btn ghost" data-action="cancel-modal">닫기</button></div></div></div>`;return `<div class="modal-shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><img src="${img(m.type==='submit'?'thinking':'sleepy')}" alt="모이"><h2 id="modal-title">${m.type==='submit'?'답안을 제출할까?':'시험을 나갈까?'}</h2><p>${m.type==='submit'?`지금까지 ${state.quiz.answers.filter(a=>a!==null).length}문제를 풀었어.<br>제출하면 이번 응시 결과가 기록에 저장돼!`:'지금까지 선택한 답안은 저장돼.<br>단, 8분 제한시간은 나가 있는 동안에도 흘러가.'}</p><div class="modal-actions"><button class="btn secondary" data-action="cancel-modal">${m.type==='submit'?'계속 풀기':'공부 계속하기'}</button><button class="btn" data-action="${m.type==='submit'?'confirm-submit':'confirm-quit'}">${m.type==='submit'?'제출하기':'나가기'}</button></div></div></div>`}

  function render(){clearInterval(timer);timer=null;let content;if(!state.user){content=auth()}else if(state.view==='quiz'&&state.quiz){content=quizPage()}else if(state.view==='home'){content=referenceHome()}else if(state.view==='rounds'){content=roundsPage()}else if(state.view==='history'){content=history()}else if(state.view==='wrong'){content=wrongEmpty()}else if(state.view==='insights'){content=insights()}else if(state.view==='result'){content=result()}else if(state.view==='review'){content=review()}else content=referenceHome();root.innerHTML=content+modal();if(state.view==='quiz'&&state.quiz)startClock();animateIn()}
  function animateIn(){if(!window.gsap||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const els=document.querySelectorAll('.anim-in');if(els.length)gsap.fromTo(els,{opacity:0,y:14},{opacity:1,y:0,duration:.55,stagger:.035,ease:'power2.out',clearProps:'opacity,transform'});const masc=document.querySelector('.world-mascot');if(masc){gsap.fromTo(masc,{opacity:0,y:25,rotation:-3},{opacity:1,y:0,rotation:0,duration:1.3,ease:'back.out(1.5)',clearProps:'opacity,transform'});gsap.to('.star-d1,.star-d2,.star-d3,.sparkle-d',{y:-9,rotation:12,repeat:-1,yoyo:true,duration:2.6,stagger:.42,ease:'sine.inOut'});gsap.to('.world-sleepy',{y:-5,repeat:-1,yoyo:true,duration:3.3,ease:'sine.inOut'});}const mascot=document.querySelector('.hero-image-wrap img');if(mascot)gsap.fromTo(mascot,{y:20,rotate:-3},{y:0,rotate:0,duration:1.2,ease:'elastic.out(1,.65)'})}
  function startClock(){const update=()=>{if(!state.quiz)return;let remain=remaining();let n=document.getElementById('clock');if(n){n.textContent=timeFormat(remain);n.classList.toggle('warning',remain<=60)}if(remain===0){clearInterval(timer);finish(true)}};update();if(state.quiz)timer=setInterval(update,1000)}
  function nav(view){if(state.quiz&&state.view==='quiz'){state.modal={type:'quit',to:view};render();return}state.view=view;state.modal=null;render();window.scrollTo(0,0)}
  function startQuiz(roundId,force=false){let r=Q[roundId];if(!r)return;let savedQuiz=storedActive();if(!force&&savedQuiz&&savedQuiz.roundId===roundId&&Array.isArray(savedQuiz.answers)&&savedQuiz.answers.length===r.questions.length){state.quiz=savedQuiz}else{state.quiz={roundId,index:0,answers:Array(r.questions.length).fill(null),startTime:Date.now()};saveActive()}state.view='quiz';state.modal=null;render();window.scrollTo(0,0)}
  function selectAnswer(i){if(!state.quiz)return;state.quiz.answers[state.quiz.index]=i;saveActive();render()}
  function moveIndex(i){if(!state.quiz)return;let r=Q[state.quiz.roundId];state.quiz.index=Math.max(0,Math.min(r.questions.length-1,i));saveActive();render()}
  async function finish(isTime=false){if(!state.quiz)return;const z=state.quiz;const round=Q[z.roundId];let correct=round.questions.reduce((n,q,i)=>n+(z.answers[i]===q.answer),0);let attempt={id:(crypto?.randomUUID?.()||'a-'+Date.now()),roundId:z.roundId,answers:[...z.answers],correct,total:round.questions.length,score:correct*10,elapsedSeconds:Math.min(round.minutes*60,Math.round((Date.now()-z.startTime)/1000)),finishedAt:new Date().toISOString()};if(state.mode==='server'){try{let savedAttempt=await api('/attempts',{method:'POST',body:JSON.stringify({roundId:z.roundId,answers:z.answers,elapsedSeconds:attempt.elapsedSeconds})});attempt=savedAttempt.attempt}catch(err){toast(err.message||'기록 저장에 실패했어요.');return}}state.attempts.unshift(attempt);if(state.mode==='demo')storage.setItem('moi_demo_attempts',JSON.stringify(state.attempts));storage.removeItem(quizKey());state.quiz=null;state.view='result';state.resultId=attempt.id;state.modal=null;render();window.scrollTo(0,0);if(window.gsap&&!matchMedia('(prefers-reduced-motion: reduce)').matches){gsap.fromTo('.result-total',{scale:.84,opacity:0},{scale:1,opacity:1,duration:.65,ease:'back.out(1.7)'})}toast(isTime?'제한 시간이 끝났어! 기록을 저장했어.':'멋져! 이번 시험 기록을 저장했어 ✦')}
  async function authSubmit(form){let message=document.getElementById('auth-message');let b={name:form.elements.namedItem('name').value.trim(),password:form.elements.namedItem('password').value};if(message)message.textContent='';const btn=form.querySelector('button[type=submit]');btn.disabled=true;try{const result=await api(state.authTab==='login'?'/login':'/register',{method:'POST',body:JSON.stringify(b)});state.user=result.user;state.view='home';state.mode='server';await loadAttempts();render();toast(`${state.user.name}님, 오늘도 반가워!`)}catch(err){if(message)message.textContent=err.message;btn.disabled=false}}
  root.addEventListener('submit',(ev)=>{if(ev.target.id==='auth-form'){ev.preventDefault();authSubmit(ev.target)}});
  root.addEventListener('click',async(ev)=>{let target=ev.target.closest('button,[data-route]');if(!target)return;
    if(target.hasAttribute('data-route')){ev.preventDefault();nav(target.dataset.route);return}
    if(target.hasAttribute('data-auth')){state.authTab=target.dataset.auth;render();return}
    if(target.hasAttribute('data-round')){const id=Number(target.dataset.round);if(target.dataset.locked==='1'){toast('앞선 회차를 완료하면 열 수 있어! ✨');return}if(state.quiz&&state.view==='quiz'&&state.quiz.roundId!==id){state.modal={type:'quit',to:'rounds'};render();return}startQuiz(id,target.dataset.new==='1');return}
    if(target.hasAttribute('data-result')){state.resultId=target.dataset.result;state.view='result';render();window.scrollTo(0,0);return}
    if(target.hasAttribute('data-filter')){state.reviewFilter=target.dataset.filter;render();return}
    if(target.hasAttribute('data-answer')){selectAnswer(Number(target.dataset.answer));return}
    if(target.hasAttribute('data-jump')){moveIndex(Number(target.dataset.jump));return}
    const action=target.dataset.action;
    if(action==='review-latest'){if(state.attempts.length){state.resultId=state.attempts[0].id;state.reviewFilter='wrong';state.view='review';render();window.scrollTo(0,0)}else{state.view='wrong';render();toast('시험을 한 번 풀면 오답노트를 볼 수 있어!')}return}
    if(action==='ref-help'){toast('각 회차는 10문제, 제한시간은 8분이야. 이전 회차를 끝내면 다음 회차가 열려!');return}
    if(action==='home-reading'||action==='home-mock'){state.homeTab=action==='home-mock'?'mock':'reading';render();return}
    if(action==='settings'||action==='profile'){state.modal={type:action};render();return}
    if(action==='export-progress'){const data={app:'moi',version:3,exportedAt:new Date().toISOString(),attempts:state.attempts};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='moi-study-backup.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('기록 백업을 저장했어!');return}
    if(action==='import-progress'){document.getElementById('moi-import')?.click();return}

    if(action==='demo'){demo();return}
    if(action==='logout'){try{await api('/logout',{method:'POST',body:'{}'})}catch{}state.user=null;state.attempts=[];state.view='home';state.quiz=null;render();return}
    if(action==='previous')moveIndex(state.quiz.index-1);
    if(action==='next')moveIndex(state.quiz.index+1);
    if(action==='submit'){state.modal={type:'submit'};render()}
    if(action==='quit'){state.modal={type:'quit',to:'home'};render()}
    if(action==='cancel-modal'){state.modal=null;render()}
    if(action==='confirm-quit'){saveActive();state.quiz=null;state.view=state.modal?.to||'home';state.modal=null;render();window.scrollTo(0,0)}
    if(action==='confirm-submit')finish();
    if(action==='review'){state.reviewFilter='wrong';state.view='review';render();window.scrollTo(0,0)}
    if(action==='back-result'){state.view='result';render()}
  });
  root.addEventListener('change',async ev=>{if(ev.target.id!=='moi-import'||state.mode!=='demo')return;const file=ev.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='moi'||!Array.isArray(obj.attempts)||obj.attempts.length>5000)throw Error('모이 학습 백업 파일이 아니에요.');const items=obj.attempts.filter(a=>Q[a.roundId]&&Array.isArray(a.answers)&&a.answers.length===Q[a.roundId].questions.length&&a.answers.every(x=>x===null||(Number.isInteger(x)&&x>=0&&x<=3))&&typeof a.id==='string'&&typeof a.finishedAt==='string').map(a=>{const r=Q[a.roundId],correct=r.questions.reduce((n,q,i)=>n+(q.answer===a.answers[i]),0);return {...a,total:r.questions.length,correct,score:Math.round(100*correct/r.questions.length)}});const ids=new Set(state.attempts.map(a=>a.id));for(const a of items){if(!ids.has(a.id)){state.attempts.push(a);ids.add(a.id)}}state.attempts.sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt));storage.setItem('moi_demo_attempts',JSON.stringify(state.attempts));state.modal=null;render();toast(`기록 ${items.length}개를 확인했어.`)}catch(err){toast(err.message||'백업 파일을 확인해 주세요.')}});
  document.addEventListener('keydown' ,(ev)=>{if(ev.key==='Escape'&&state.modal){state.modal=null;render()}});
  init();
})();
</script>
</body>
