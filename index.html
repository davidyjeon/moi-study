  <script id="question-bank" type="application/json">[{"id": 1, "title": "ROUND 01", "label": "기초 다지기", "minutes": 8, "questions": [{"id": "1-1", "category": "품사", "stem": "The marketing team will provide a _____ report at Friday's meeting.", "choices": ["detail", "detailed", "detailing", "details"], "answer": 1, "explanation": "보고서를 수식하는 형용사 detailed가 필요합니다. provide a detailed report = 상세한 보고서를 제공하다."}, {"id": "1-2", "category": "시제·태", "stem": "All reimbursement requests _____ by the finance department before payment is issued.", "choices": ["review", "are reviewed", "reviewing", "have reviewed"], "answer": 1, "explanation": "요청서가 검토되는 것이므로 현재시제 수동태 are reviewed가 맞습니다."}, {"id": "1-3", "category": "수일치", "stem": "Each of the regional managers _____ required to submit a forecast.", "choices": ["are", "is", "have", "were"], "answer": 1, "explanation": "Each of + 복수명사는 단수 취급하므로 is required가 맞습니다."}, {"id": "1-4", "category": "전치사", "stem": "The updated policy takes effect _____ November 1.", "choices": ["at", "on", "in", "by"], "answer": 1, "explanation": "구체적인 날짜 앞에는 전치사 on을 씁니다."}, {"id": "1-5", "category": "접속사", "stem": "_____ demand increased, the company postponed its expansion.", "choices": ["Although", "Because", "Unless", "So"], "answer": 0, "explanation": "수요가 증가했지만 확장을 연기했다는 양보의 의미이므로 Although가 적절합니다."}, {"id": "1-6", "category": "관계사", "stem": "Candidates _____ applications are incomplete will be contacted by email.", "choices": ["who", "whose", "whom", "which"], "answer": 1, "explanation": "명사 applications를 소유 관계로 연결하는 관계형용사 whose가 필요합니다."}, {"id": "1-7", "category": "어휘", "stem": "Please _____ the attached schedule before confirming attendance.", "choices": ["review", "replace", "reserve", "repair"], "answer": 0, "explanation": "참석을 확정하기 전 일정을 검토한다는 문맥이므로 review가 맞습니다."}, {"id": "1-8", "category": "준동사", "stem": "The firm plans _____ two new branches next year.", "choices": ["open", "opening", "to open", "opened"], "answer": 2, "explanation": "plan은 목적어로 to부정사를 취합니다. plans to open이 자연스럽습니다."}, {"id": "1-9", "category": "비교", "stem": "This quarter's revenue is _____ than analysts predicted.", "choices": ["high", "higher", "highest", "highly"], "answer": 1, "explanation": "than이 있으므로 비교급 higher를 씁니다."}, {"id": "1-10", "category": "가정법·도치", "stem": "If the supplier _____ the parts today, production can resume tomorrow.", "choices": ["ships", "shipped", "would ship", "had shipped"], "answer": 0, "explanation": "미래의 가능한 조건을 나타내는 if절에는 현재시제 ships를 씁니다."}]}, {"id": 2, "title": "ROUND 02", "label": "핵심 문법", "minutes": 8, "questions": [{"id": "2-1", "category": "품사", "stem": "A _____ maintained database reduces duplicate entries.", "choices": ["proper", "properly", "property", "properties"], "answer": 1, "explanation": "과거분사 maintained를 수식하는 부사 properly가 필요합니다."}, {"id": "2-2", "category": "시제·태", "stem": "The research findings _____ at the conference next week.", "choices": ["present", "will be presented", "presented", "were presenting"], "answer": 1, "explanation": "다음 주에 발표될 예정인 수동의 미래 사건이므로 will be presented입니다."}, {"id": "2-3", "category": "수일치", "stem": "Neither the director nor the assistants _____ available this afternoon.", "choices": ["is", "was", "are", "has"], "answer": 2, "explanation": "neither A nor B에서는 동사가 가까운 주어 B(assistants)에 일치하므로 are입니다."}, {"id": "2-4", "category": "전치사", "stem": "Please submit the documents _____ the end of the business day.", "choices": ["by", "at", "on", "for"], "answer": 0, "explanation": "마감 시한을 뜻하는 by the end of ...가 정답입니다."}, {"id": "2-5", "category": "접속사", "stem": "The meeting was rescheduled _____ several participants were traveling.", "choices": ["because", "despite", "whereas", "unless"], "answer": 0, "explanation": "참가자들이 출장 중이어서 일정이 변경됐다는 이유를 나타내는 because가 적절합니다."}, {"id": "2-6", "category": "관계사", "stem": "The consultant _____ led the workshop will return in June.", "choices": ["who", "whom", "whose", "which"], "answer": 0, "explanation": "사람을 선행사로 하며 관계절의 주어인 who가 맞습니다."}, {"id": "2-7", "category": "어휘", "stem": "The factory will _____ operations after the safety inspection is completed.", "choices": ["resume", "consume", "assume", "presume"], "answer": 0, "explanation": "중단한 운영을 재개한다는 뜻의 resume operations가 정확한 표현입니다."}, {"id": "2-8", "category": "준동사", "stem": "Staff members are encouraged _____ their passwords regularly.", "choices": ["change", "changed", "to change", "changing"], "answer": 2, "explanation": "be encouraged to + 동사원형 구조이므로 to change가 맞습니다."}, {"id": "2-9", "category": "비교", "stem": "The revised plan is _____ costly than the original proposal.", "choices": ["less", "lesser", "least", "few"], "answer": 0, "explanation": "비교급 구조 less + 형용사 + than이므로 less가 맞습니다."}, {"id": "2-10", "category": "가정법·도치", "stem": "Had we received your order earlier, we _____ it yesterday.", "choices": ["ship", "would ship", "would have shipped", "will have shipped"], "answer": 2, "explanation": "Had we received는 If we had received의 도치로 과거 사실의 반대 가정이므로 would have shipped가 맞습니다."}]}, {"id": 3, "title": "ROUND 03", "label": "실전 적응", "minutes": 8, "questions": [{"id": "3-1", "category": "품사", "stem": "The CEO expressed _____ about the project's future.", "choices": ["confident", "confidently", "confidence", "confide"], "answer": 2, "explanation": "타동사 expressed의 목적어가 되는 명사 confidence가 필요합니다."}, {"id": "3-2", "category": "시제·태", "stem": "By the time the auditors arrive, the team _____ the records.", "choices": ["has prepared", "had prepared", "will have prepared", "prepares"], "answer": 2, "explanation": "미래의 특정 시점까지 완료될 일을 표현하므로 미래완료 will have prepared가 적절합니다."}, {"id": "3-3", "category": "수일치", "stem": "The number of visitors _____ increased since the renovation.", "choices": ["have", "has", "are", "were"], "answer": 1, "explanation": "the number of + 복수명사는 단수 주어로 취급하므로 has increased가 맞습니다."}, {"id": "3-4", "category": "전치사", "stem": "The shipment was delayed _____ severe weather conditions.", "choices": ["due to", "because", "although", "unless"], "answer": 0, "explanation": "명사구 severe weather conditions 앞에는 due to가 오며 because는 절을 이끕니다."}, {"id": "3-5", "category": "접속사", "stem": "The system will remain offline _____ the upgrade is complete.", "choices": ["until", "despite", "during", "because of"], "answer": 0, "explanation": "업그레이드 완료 시점까지라는 뜻을 나타내며 뒤에 절이 오는 until이 정답입니다."}, {"id": "3-6", "category": "관계사", "stem": "The proposal, _____ was submitted on Monday, includes a revised budget.", "choices": ["that", "which", "who", "whose"], "answer": 1, "explanation": "콤마로 분리된 계속적 용법의 사물 관계대명사는 which를 사용합니다."}, {"id": "3-7", "category": "어휘", "stem": "The board decided to _____ the deadline by two weeks.", "choices": ["extend", "expand", "extract", "expose"], "answer": 0, "explanation": "마감일을 연장한다는 뜻으로 extend the deadline을 씁니다."}, {"id": "3-8", "category": "준동사", "stem": "The team avoided _____ additional costs by changing vendors.", "choices": ["incur", "incurred", "to incur", "incurring"], "answer": 3, "explanation": "avoid 다음에는 동명사가 오므로 incurring이 맞습니다."}, {"id": "3-9", "category": "비교", "stem": "Of the three models, the latest one is the _____ efficient.", "choices": ["more", "most", "much", "many"], "answer": 1, "explanation": "세 개 이상 중 가장 효율적이라는 최상급이므로 most가 필요합니다."}, {"id": "3-10", "category": "가정법·도치", "stem": "Were the price lower, we _____ a larger quantity.", "choices": ["purchase", "purchased", "would purchase", "had purchased"], "answer": 2, "explanation": "Were the price lower는 If the price were lower의 도치로, 주절은 would purchase입니다."}]}, {"id": 4, "title": "ROUND 04", "label": "오답 줄이기", "minutes": 8, "questions": [{"id": "4-1", "category": "품사", "stem": "The instructions are _____ clear for new employees to follow.", "choices": ["sufficient", "sufficiently", "sufficiency", "suffice"], "answer": 1, "explanation": "형용사 clear를 수식하는 부사 sufficiently가 필요합니다."}, {"id": "4-2", "category": "시제·태", "stem": "The documents _____ before the inspection began yesterday.", "choices": ["had been filed", "have filed", "filing", "will be filing"], "answer": 0, "explanation": "과거의 검사보다 먼저 서류가 정리되어 있었으므로 과거완료 수동태 had been filed가 맞습니다."}, {"id": "4-3", "category": "수일치", "stem": "A list of approved vendors _____ available on the intranet.", "choices": ["are", "is", "have", "were"], "answer": 1, "explanation": "주어의 핵심은 단수 명사 A list이므로 is입니다."}, {"id": "4-4", "category": "전치사", "stem": "The customer requested a refund _____ a damaged item.", "choices": ["for", "at", "from", "since"], "answer": 0, "explanation": "손상된 물품에 대한 환불이라는 뜻으로 a refund for an item이 자연스럽습니다."}, {"id": "4-5", "category": "접속사", "stem": "_____ completing the survey, participants will receive a confirmation email.", "choices": ["After", "Despite", "Unless", "Because"], "answer": 0, "explanation": "설문을 마친 후 이메일을 받으므로 After + -ing가 맞습니다."}, {"id": "4-6", "category": "관계사", "stem": "The training room _____ we held the seminar has been renovated.", "choices": ["where", "who", "whose", "which"], "answer": 0, "explanation": "관계절에서 장소를 나타내는 부사 역할을 하므로 where가 맞습니다."}, {"id": "4-7", "category": "어휘", "stem": "The manufacturer has decided to _____ the defective units.", "choices": ["recall", "reclaim", "recover", "receive"], "answer": 0, "explanation": "결함 제품을 회수한다는 의미로 recall the defective units가 맞습니다."}, {"id": "4-8", "category": "준동사", "stem": "Employees must refrain from _____ confidential documents outside the office.", "choices": ["share", "to share", "shared", "sharing"], "answer": 3, "explanation": "refrain from에서 from은 전치사이므로 동명사 sharing이 옵니다."}, {"id": "4-9", "category": "비교", "stem": "Sales in April were nearly twice as high _____ those in March.", "choices": ["as", "than", "from", "like"], "answer": 0, "explanation": "배수 비교는 twice as + 형용사 + as 구조입니다."}, {"id": "4-10", "category": "가정법·도치", "stem": "If I _____ you, I would contact the client today.", "choices": ["am", "were", "have been", "will be"], "answer": 1, "explanation": "현재 사실과 다른 가정에서 If I were you를 사용합니다."}]}, {"id": 5, "title": "ROUND 05", "label": "고득점 도전", "minutes": 8, "questions": [{"id": "5-1", "category": "품사", "stem": "The _____ of the new software took longer than expected.", "choices": ["implement", "implementation", "implementing", "implemented"], "answer": 1, "explanation": "정관사 The와 of 사이에는 명사 implementation이 필요합니다."}, {"id": "5-2", "category": "시제·태", "stem": "The contract _____ by both parties before the launch.", "choices": ["must sign", "must be signed", "must have signing", "must signing"], "answer": 1, "explanation": "계약서가 서명되어야 하므로 조동사 + 수동태 must be signed가 맞습니다."}, {"id": "5-3", "category": "수일치", "stem": "The findings from the latest surveys _____ consistent with earlier results.", "choices": ["is", "was", "are", "has"], "answer": 2, "explanation": "주어의 핵심 명사 findings는 복수이므로 are consistent가 맞습니다."}, {"id": "5-4", "category": "전치사", "stem": "Additional equipment can be ordered _____ request.", "choices": ["upon", "inside", "onto", "across"], "answer": 0, "explanation": "upon request는 요청 시에라는 뜻의 고정 표현입니다."}, {"id": "5-5", "category": "접속사", "stem": "The company introduced a flexible schedule _____ employees could avoid rush-hour traffic.", "choices": ["so that", "even though", "in spite of", "unless"], "answer": 0, "explanation": "직원들이 출퇴근 혼잡을 피할 수 있도록이라는 목적이므로 so that이 정답입니다."}, {"id": "5-6", "category": "관계사", "stem": "The employee to _____ the award was given thanked the team.", "choices": ["who", "whom", "whose", "which"], "answer": 1, "explanation": "전치사 to 뒤에서 사람을 받는 목적격 관계대명사 whom이 맞습니다."}, {"id": "5-7", "category": "어휘", "stem": "The new software is _____ with most existing devices.", "choices": ["compatible", "considerable", "comparable", "competitive"], "answer": 0, "explanation": "기존 기기와 호환된다는 뜻으로 compatible with가 맞습니다."}, {"id": "5-8", "category": "준동사", "stem": "The customer agreed _____ the revised terms.", "choices": ["accept", "accepting", "to accept", "accepted"], "answer": 2, "explanation": "agree는 목적어로 to부정사를 취하므로 to accept가 맞습니다."}, {"id": "5-9", "category": "비교", "stem": "This device operates more _____ than its predecessor.", "choices": ["efficient", "efficiently", "efficiency", "efficiencies"], "answer": 1, "explanation": "동사 operates를 수식하는 부사의 비교형 more efficiently가 맞습니다."}, {"id": "5-10", "category": "가정법·도치", "stem": "Should you _____ assistance, contact the help desk.", "choices": ["need", "needed", "needing", "to need"], "answer": 0, "explanation": "Should you need는 If you should need의 도치형이므로 동사원형 need가 옵니다."}]}, {"id": 6, "title": "ROUND 06", "label": "파이널 체크", "minutes": 8, "questions": [{"id": "6-1", "category": "품사", "stem": "We appreciate your _____ response to our inquiry.", "choices": ["prompt", "promptly", "promptness", "prompted"], "answer": 0, "explanation": "명사 response를 수식하는 형용사 prompt(신속한)가 필요합니다."}, {"id": "6-2", "category": "시제·태", "stem": "The supervisor _____ the report when the phone rang.", "choices": ["reviews", "was reviewing", "has reviewed", "will review"], "answer": 1, "explanation": "전화가 울리던 과거 시점에 진행 중인 동작이므로 was reviewing이 맞습니다."}, {"id": "6-3", "category": "수일치", "stem": "Every piece of equipment _____ inspected before use.", "choices": ["are", "have", "is", "were"], "answer": 2, "explanation": "Every piece가 단수 주어이므로 is inspected가 맞습니다."}, {"id": "6-4", "category": "전치사", "stem": "The package arrived _____ schedule despite the storm.", "choices": ["on", "in", "over", "at"], "answer": 0, "explanation": "on schedule은 예정대로라는 뜻의 고정 표현입니다."}, {"id": "6-5", "category": "접속사", "stem": "_____ the budget was approved, the team began hiring.", "choices": ["Once", "Unless", "Despite", "Whereas"], "answer": 0, "explanation": "예산이 승인된 후 채용을 시작했다는 뜻으로 Once가 자연스럽습니다."}, {"id": "6-6", "category": "관계사", "stem": "The designer _____ portfolio impressed the committee received an offer.", "choices": ["who", "whose", "whom", "which"], "answer": 1, "explanation": "디자이너의 포트폴리오라는 소유 관계이므로 whose가 맞습니다."}, {"id": "6-7", "category": "어휘", "stem": "The new policy will _____ all full-time employees.", "choices": ["apply to", "comply with", "depend upon", "result from"], "answer": 0, "explanation": "정책이 직원들에게 적용된다는 뜻이므로 apply to가 정답입니다."}, {"id": "6-8", "category": "준동사", "stem": "We look forward to _____ with your team next quarter.", "choices": ["work", "worked", "working", "to work"], "answer": 2, "explanation": "look forward to에서 to는 전치사이므로 working이 맞습니다."}, {"id": "6-9", "category": "비교", "stem": "The second proposal is _____ practical of the two.", "choices": ["the more", "the most", "more", "most"], "answer": 0, "explanation": "두 대상 중 더 ~한 것을 특정할 때 the more + 형용사 + of the two를 씁니다."}, {"id": "6-10", "category": "가정법·도치", "stem": "If the report had been submitted on time, the committee _____ it already.", "choices": ["reviews", "will review", "would have reviewed", "had reviewed"], "answer": 2, "explanation": "과거 사실과 반대되는 가정이므로 would have reviewed가 맞습니다."}]}]</script>
